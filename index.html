<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masala Barcelona - Receptes</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #000;
            color: #fff;
            line-height: 1.6;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: #000;
            padding: 1rem 2rem 0.5rem;
            text-align: center;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        header::after {
            content: '';
            position: absolute;
            bottom: -30px;
            left: 0;
            right: 0;
            height: 30px;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='30' viewBox='0 0 60 30' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M 0,0 Q 15,30 30,0 Z M 30,0 Q 45,30 60,0 Z' fill='%23000000'/%3E%3C/svg%3E");
            background-size: 60px 30px;
            background-repeat: repeat-x;
        }

        h1 {
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: -1px;
            margin-bottom: 0.5rem;
            color: #fff;
        }

        .subtitle {
            color: #fff;
            font-size: 1.1rem;
            font-weight: 300;
            margin-top: 0.5rem;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
            padding-top: 180px;
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 2rem;
        }

        @media (max-width: 968px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .sidebar {
            background: #1a1a1a;
            padding: 2rem;
            border-radius: 12px;
            position: sticky;
            top: 180px;
            border: 1px solid #333;
            max-height: calc(100vh - 200px);
            display: flex;
            flex-direction: column;
        }

        .sidebar h2 {
            font-size: 1.3rem;
            margin-bottom: 1rem;
            color: #FFD700;
            border-bottom: 2px solid #FFD700;
            padding-bottom: 0.5rem;
            flex-shrink: 0;
        }

        .search-box {
            margin-bottom: 1rem;
            flex-shrink: 0;
        }

        .search-box input {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #333;
            border-radius: 6px;
            background: #0a0a0a;
            color: #fff;
            font-size: 0.9rem;
            transition: border-color 0.3s ease;
        }

        .search-box input:focus {
            outline: none;
            border-color: #FFD700;
        }

        .search-box input::placeholder {
            color: #666;
        }

        .index-container {
            overflow-y: auto;
            flex: 1;
            margin-right: -0.5rem;
            padding-right: 0.5rem;
        }

        .index-container::-webkit-scrollbar {
            width: 8px;
        }

        .index-container::-webkit-scrollbar-track {
            background: #0a0a0a;
            border-radius: 4px;
        }

        .index-container::-webkit-scrollbar-thumb {
            background: #FFD700;
            border-radius: 4px;
        }

        .index-container::-webkit-scrollbar-thumb:hover {
            background: #FFC700;
        }

        #index {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        #index a {
            color: #fff;
            text-decoration: none;
            padding: 0.5rem 0.75rem;
            border-radius: 6px;
            transition: all 0.3s ease;
            border-left: 3px solid transparent;
            font-size: 0.95rem;
        }

        #index a:hover {
            background: #2a2a2a;
            border-left-color: #FFD700;
            padding-left: 1rem;
        }

        .content {
            background: #fff;
            color: #000;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(255, 215, 0, 0.1);
        }

        .recipe {
            margin-bottom: 3rem;
            padding-bottom: 3rem;
            border-bottom: 2px solid #f0f0f0;
            scroll-margin-top: 150px;
        }

        .recipe:last-child {
            border-bottom: none;
        }

        .recipe h2 {
            font-size: 2rem;
            margin-bottom: 1.5rem;
            color: #000;
            padding-left: 1rem;
            border-left: 4px solid #FFD700;
        }

        .recipe p {
            white-space: pre-wrap;
            color: #333;
            font-size: 1rem;
            line-height: 1.8;
        }

        .recipe img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin: 1rem 0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .recipe ul, .recipe ol {
            margin-left: 2rem;
            margin-bottom: 1rem;
        }

        .recipe li {
            margin-bottom: 0.5rem;
        }

        .recipe strong {
            color: #000;
            font-weight: 600;
        }

        footer {
            text-align: center;
            padding: 2rem;
            background: #000;
            color: #FFD700;
            margin-top: 2rem;
            font-size: 0.9rem;
        }

        .loading {
            text-align: center;
            padding: 3rem;
            color: #FFD700;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
    <header>
        <h1>Masala Barcelona</h1>
        <p class="subtitle">Col·lecció de Receptes</p>
    </header>

    <div class="container">
        <aside class="sidebar">
            <h2>Índex de Receptes</h2>
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Cerca receptes..." onkeyup="filterRecipes()">
            </div>
            <div class="index-container">
                <div id="index"></div>
            </div>
        </aside>

        <main class="content">
            <div class="loading">Carregant receptes...</div>
            <div id="body"></div>
        </main>
    </div>

    <footer>
        &copy; Masala Barcelona - Receptes de cuina
    </footer>

    <script>
        function loadXMLDoc() {
            var xmlhttp = new XMLHttpRequest();
            xmlhttp.onreadystatechange = function() {
                if (this.readyState == 4 && this.status == 200) {
                    myFunction(this);
                }
            };
            xmlhttp.open("GET", "receptes.xml", true);
            xmlhttp.send();
        }

        function processContent(content) {
            // Remove CDATA markers
            var processed = content.replace("<![CDATA[", "").replace("]]>", "");
            // Replace line breaks with <br> tags
            processed = processed.replace(/\n/g, '<br>');
            return processed;
        }

        function myFunction(xml) {
            const parser = new DOMParser();
            var x, i, xmlDoc, txt;
            xmlDoc = xml.responseXML;
            txt = "";
            list = [];
            x = xmlDoc.getElementsByTagName("item");

            for (i = 0; i < x.length; i++) {
                list.push({
                    "title": x[i].getElementsByTagName("title")[0].textContent,
                    "content": x[i].getElementsByTagName("content:encoded")[0].innerHTML
                });
            }

            list.sort(function (a, b) {
                if (a.title < b.title) {
                    return -1;
                }
                if (a.title > b.title) {
                    return 1;
                }
                return 0;
            });

            // Clear loading message
            document.querySelector('.loading').style.display = 'none';

            // Build index
            var indexHTML = '';
            var bodyHTML = '';

            for (i = 0; i < list.length; i++) {
                var recipeId = 'recipe-' + i;
                indexHTML += '<a href="#' + recipeId + '">' + list[i].title + '</a>';
                bodyHTML += '<div class="recipe" id="' + recipeId + '">';
                bodyHTML += '<h2>' + list[i].title + '</h2>';
                bodyHTML += '<div>' + processContent(list[i].content) + '</div>';
                bodyHTML += '</div>';
            }

            document.getElementById("index").innerHTML = indexHTML;
            document.getElementById("body").innerHTML = bodyHTML;
        }

        function filterRecipes() {
            var input = document.getElementById('search-input');
            var filter = input.value.toLowerCase();
            var index = document.getElementById('index');
            var links = index.getElementsByTagName('a');

            for (var i = 0; i < links.length; i++) {
                var txtValue = links[i].textContent || links[i].innerText;
                if (txtValue.toLowerCase().indexOf(filter) > -1) {
                    links[i].style.display = "";
                } else {
                    links[i].style.display = "none";
                }
            }
        }

        loadXMLDoc();
    </script>
</body>
</html>
