<!--[if !IE]><!--> <html lang="ca"> <!--<![endif]-->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width = 1050, user-scalable = no" />
<title>Masala Barcelona - Magazine</title>
<script type="text/javascript" src="https://code.jquery.com/jquery-1.7.js"></script>
<script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/modernizr/2.5.3/modernizr.min.js"></script>
<style>
	* {
		margin: 0;
		padding: 0;
		box-sizing: border-box;
	}

	body {
		font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
		background: #000;
		color: #fff;
		overflow: hidden;
	}

	.header {
		position: fixed;
		top: 0;
		left: 0;
		right: 0;
		background: linear-gradient(180deg, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.8) 100%);
		padding: 1.5rem 2rem;
		z-index: 1000;
		border-bottom: 2px solid #FFD700;
		backdrop-filter: blur(10px);
	}

	.header h1 {
		font-size: 1.8rem;
		font-weight: 700;
		background: linear-gradient(135deg, #FFD700 0%, #FFF 50%, #FFD700 100%);
		-webkit-background-clip: text;
		-webkit-text-fill-color: transparent;
		background-clip: text;
		text-align: center;
		margin: 0;
	}

	#sideindex {
		position: fixed;
		left: 0;
		top: 80px;
		width: 280px;
		height: calc(100vh - 80px);
		background: #1a1a1a;
		padding: 2rem 1.5rem;
		overflow-y: auto;
		border-right: 2px solid #FFD700;
		z-index: 100;
		box-shadow: 4px 0 12px rgba(255, 215, 0, 0.1);
	}

	#sideindex::before {
		content: 'Índex de Receptes';
		display: block;
		font-size: 1.1rem;
		font-weight: 600;
		color: #FFD700;
		margin-bottom: 1.5rem;
		padding-bottom: 0.75rem;
		border-bottom: 2px solid #FFD700;
	}

	#sideindex::-webkit-scrollbar {
		width: 8px;
	}

	#sideindex::-webkit-scrollbar-track {
		background: #0a0a0a;
	}

	#sideindex::-webkit-scrollbar-thumb {
		background: #FFD700;
		border-radius: 4px;
	}

	#sideindex::-webkit-scrollbar-thumb:hover {
		background: #FFC700;
	}

	#sideindex br {
		display: none;
	}

	#sideindex::after {
		content: '';
		display: block;
		height: 2rem;
	}

	#sideindex {
		line-height: 2.2;
		color: #ddd;
		font-size: 0.9rem;
	}
</style>
</head>
<body>

<div class="header">
	<h1>Masala Barcelona - Magazine</h1>
</div>

<div class="flipbook-viewport">
	<div class="container">
		<div class="flipbook" id="flipbook" style="white-space: pre-wrap;">
			<div style="background: linear-gradient(135deg, #000 0%, #1a1a1a 50%, #000 100%); display: flex; align-items: center; justify-content: center; flex-direction: column;">
				<h2 style="font-size: 3rem; color: #FFD700; margin-bottom: 1rem; text-align: center;">Masala Barcelona</h2>
				<p style="color: #fff; font-size: 1.2rem;">Receptes de Cuina</p>
			</div>
			<div style="padding: 3rem 2rem; background: #fff;"><p id="index" style="color: #000; line-height: 2;"></p></div>
		</div>
	</div>
</div>

<p id="sideindex"></p>

<script type="text/javascript">

	function loadXMLDoc() {
		var xmlhttp = new XMLHttpRequest();
		xmlhttp.onreadystatechange = function() {
			if (this.readyState == 4 && this.status == 200) {
				renderPage(this);
			}
		};
		xmlhttp.open("GET", "receptes.xml", true);
		xmlhttp.send();
	}

	function renderPage(xml) {
		const parser = new DOMParser();
		var x, i, xmlDoc, txt;
		xmlDoc = xml.responseXML;
		txt = "";
		list = [];
		x = xmlDoc.getElementsByTagName("item");
		for (i = 0; i< x.length; i++) {
			list.push({
				"title": x[i].getElementsByTagName("title")[0].textContent,
				"content": x[i].getElementsByTagName("content:encoded")[0].innerHTML
			});
		}
		list.sort(function (a, b) {
			if (a.title < b.title) {
				return -1;
			}
			if (a.title > b.title) {
				return 1;
			}
			return 0;
		});

		for (i = 0; i< list.length; i++) {
			console.log(list[i]);
			document.getElementById("index").innerHTML += list[i].title + "<br/>";
			document.getElementById("sideindex").innerHTML += list[i].title + "<br/>";

			const node = document.createElement("div");
			node.style.cssText = "padding: 2rem; background: #fff; color: #000;";
			node.innerHTML = "<h2 style='color: #000; border-left: 4px solid #FFD700; padding-left: 1rem; margin-bottom: 1.5rem;'>" + list[i].title + "</h2><div style='color: #333; line-height: 1.8;'>" + list[i].content.replace("<![CDATA[", "").replace("]]>", "") + "</div>";
			document.getElementById("flipbook").appendChild(node);
		}
	}

	loadXMLDoc();

	function loadApp() {
		// Create the flipbook
		$('.flipbook').turn({
			// Width
			width: 1200,

			// Height
			height: 848,

			// Elevation
			elevation: 50,

			// Enable gradients
			gradients: true,

			// Auto center this flipbook
			autoCenter: true
		});
	}

	// Load the HTML4 version if there's not CSS transform
	yepnope({
		test: Modernizr.csstransforms,
		yep: ['js/turn.js'],
		nope: ['js/turn.html4.min.js'],
		both: ['css/basic.css'],
		complete: loadApp
	});

</script>

</body>
</html>
