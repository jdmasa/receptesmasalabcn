<!doctype html>
<!--[if lt IE 7 ]> <html lang="en" class="ie6"> <![endif]-->
<!--[if IE 7 ]>    <html lang="en" class="ie7"> <![endif]-->
<!--[if IE 8 ]>    <html lang="en" class="ie8"> <![endif]-->
<!--[if IE 9 ]>    <html lang="en" class="ie9"> <![endif]-->
<!--[if !IE]><!--> <html lang="ca"> <!--<![endif]-->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width = 1050, user-scalable = no" />
<title>Masala Barcelona - Magazine</title>
<script type="text/javascript" src="https://code.jquery.com/jquery-1.7.js"></script>
<script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/modernizr/2.5.3/modernizr.min.js"></script>
<style>
	* {
		margin: 0;
		padding: 0;
		box-sizing: border-box;
	}

	html {
		scroll-behavior: smooth;
	}

	body {
		font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
		background: #000;
		color: #fff;
		overflow: hidden;
	}

	.header {
		position: fixed;
		top: 0;
		left: 0;
		right: 0;
		background: #000;
		padding: 1rem 2rem 0.5rem;
		z-index: 1000;
		box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
	}

	.header::after {
		content: '';
		position: absolute;
		bottom: -30px;
		left: 0;
		right: 0;
		height: 30px;
		background-image: url("data:image/svg+xml,%3Csvg width='60' height='30' viewBox='0 0 60 30' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M 0,0 Q 15,30 30,0 Z M 30,0 Q 45,30 60,0 Z' fill='%23000000'/%3E%3C/svg%3E");
		background-size: 60px 30px;
		background-repeat: repeat-x;
	}

	.header h1 {
		font-size: 1.8rem;
		font-weight: 700;
		color: #fff;
		text-align: center;
		margin: 0;
	}

	#sideindex {
		position: fixed;
		left: 0;
		top: 130px;
		width: 280px;
		height: calc(100vh - 130px);
		background: #1a1a1a;
		padding: 2rem 1.5rem;
		border-right: 2px solid #FFD700;
		z-index: 100;
		box-shadow: 4px 0 12px rgba(255, 215, 0, 0.1);
		display: flex;
		flex-direction: column;
	}

	.toc-header {
		font-size: 1.1rem;
		font-weight: 600;
		color: #FFD700;
		margin-bottom: 1rem;
		padding-bottom: 0.75rem;
		border-bottom: 2px solid #FFD700;
		flex-shrink: 0;
	}

	.search-box-magazine {
		margin-bottom: 1rem;
		flex-shrink: 0;
	}

	.search-box-magazine input {
		width: 100%;
		padding: 0.75rem;
		border: 2px solid #333;
		border-radius: 6px;
		background: #0a0a0a;
		color: #fff;
		font-size: 0.9rem;
		transition: border-color 0.3s ease;
	}

	.search-box-magazine input:focus {
		outline: none;
		border-color: #FFD700;
	}

	.search-box-magazine input::placeholder {
		color: #666;
	}

	.index-scroll {
		overflow-y: auto;
		flex: 1;
		margin-right: -0.5rem;
		padding-right: 0.5rem;
	}

	.index-scroll::-webkit-scrollbar {
		width: 8px;
	}

	.index-scroll::-webkit-scrollbar-track {
		background: #0a0a0a;
		border-radius: 4px;
	}

	.index-scroll::-webkit-scrollbar-thumb {
		background: #FFD700;
		border-radius: 4px;
	}

	.index-scroll::-webkit-scrollbar-thumb:hover {
		background: #FFC700;
	}

	#sideindex-content {
		line-height: 2.2;
		color: #ddd;
		font-size: 0.9rem;
	}

	#sideindex-content br {
		display: block;
		margin: 0.5rem 0;
	}
</style>
</head>
<body>

<div class="header">
	<h1>Masala Barcelona - Magazine</h1>
</div>

<div class="flipbook-viewport">
	<div class="container">
		<div class="flipbook" id="flipbook" style="white-space: pre-wrap;">
			<div style="background: linear-gradient(135deg, #000 0%, #1a1a1a 50%, #000 100%); display: flex; align-items: center; justify-content: center; flex-direction: column;">
				<h2 style="font-size: 3rem; color: #FFD700; margin-bottom: 1rem; text-align: center;">Masala Barcelona</h2>
				<p style="color: #fff; font-size: 1.2rem;">Receptes de Cuina</p>
			</div>
			<div style="padding: 3rem 2rem; background: #fff;"><p id="index" style="color: #000; line-height: 2;"></p></div>
		</div>
	</div>
</div>

<div id="sideindex">
	<div class="toc-header">Índex de Receptes</div>
	<div class="search-box-magazine">
		<input type="text" id="search-input-magazine" placeholder="Cerca receptes..." onkeyup="filterRecipesMagazine()">
	</div>
	<div class="index-scroll">
		<div id="sideindex-content"></div>
	</div>
</div>

<script type="text/javascript">

	function loadXMLDoc() {
		var xmlhttp = new XMLHttpRequest();
		xmlhttp.onreadystatechange = function() {
			if (this.readyState == 4 && this.status == 200) {
				renderPage(this);
			}
		};
		xmlhttp.open("GET", "receptes.xml", true);
		xmlhttp.send();
	}

	function processContent(content) {
		// Remove CDATA markers
		var processed = content.replace("<![CDATA[", "").replace("]]>", "");
		// Replace line breaks with <br> tags
		processed = processed.replace(/\n/g, '<br>');
		return processed;
	}

	function renderPage(xml) {
		const parser = new DOMParser();
		var x, i, xmlDoc, txt;
		xmlDoc = xml.responseXML;
		txt = "";
		list = [];
		x = xmlDoc.getElementsByTagName("item");
		for (i = 0; i< x.length; i++) {
			list.push({
				"title": x[i].getElementsByTagName("title")[0].textContent,
				"content": x[i].getElementsByTagName("content:encoded")[0].innerHTML
			});
		}
		list.sort(function (a, b) {
			if (a.title < b.title) {
				return -1;
			}
			if (a.title > b.title) {
				return 1;
			}
			return 0;
		});

		for (i = 0; i< list.length; i++) {
			console.log(list[i]);
			document.getElementById("index").innerHTML += list[i].title + "<br/>";
			document.getElementById("sideindex-content").innerHTML += '<div class="toc-item">' + list[i].title + '</div>';

			const node = document.createElement("div");
			node.style.cssText = "padding: 2rem; background: #fff; color: #000;";
			node.innerHTML = "<h2 style='color: #000; border-left: 4px solid #FFD700; padding-left: 1rem; margin-bottom: 1.5rem;'>" + list[i].title + "</h2><div style='color: #333; line-height: 1.8;'>" + processContent(list[i].content) + "</div>";
			document.getElementById("flipbook").appendChild(node);
		}
	}

	function filterRecipesMagazine() {
		var input = document.getElementById('search-input-magazine');
		var filter = input.value.toLowerCase();
		var content = document.getElementById('sideindex-content');
		var items = content.getElementsByClassName('toc-item');

		for (var i = 0; i < items.length; i++) {
			var txtValue = items[i].textContent || items[i].innerText;
			if (txtValue.toLowerCase().indexOf(filter) > -1) {
				items[i].style.display = "";
			} else {
				items[i].style.display = "none";
			}
		}
	}

	loadXMLDoc();

	function loadApp() {
		// Create the flipbook
		$('.flipbook').turn({
			// Width
			width: 1200,

			// Height
			height: 848,

			// Elevation
			elevation: 50,

			// Enable gradients
			gradients: true,

			// Auto center this flipbook
			autoCenter: true
		});
	}

	// Load the HTML4 version if there's not CSS transform
	yepnope({
		test: Modernizr.csstransforms,
		yep: ['js/turn.js'],
		nope: ['js/turn.html4.min.js'],
		both: ['css/basic.css'],
		complete: loadApp
	});

</script>

</body>
</html>
